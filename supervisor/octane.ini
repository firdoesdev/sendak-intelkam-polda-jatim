[program:octane]
command=/usr/local/bin/php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --workers=1
directory=/var/www/html
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=10
