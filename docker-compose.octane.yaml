version: "3.9"

services:
  octane:
    build:
      context: .
      dockerfile: docker/octane/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: app-octane
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # - APP_ENV=local
      # - APP_DEBUG=true
      - INERTIA_SSR_ENABLED=false
      - DB_HOST=pgsql
      - REDIS_HOST=redis
    env_file:
      - .env
    ports:
      - "3001:8000"
    volumes:
      - app-public:/var/www/html/public
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  pgsql:
    image: postgres:18-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sendak}
      POSTGRES_USER: ${DB_USERNAME:-sendak}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sendak}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 512M
    shm_size: 128mb

  redis:
    image: redis:alpine
    container_name: app-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M

networks:
  app:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local
  app-public:
    driver: local
