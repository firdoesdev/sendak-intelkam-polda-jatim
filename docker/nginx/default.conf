server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html index.php;

    client_max_body_size 20M;
    large_client_header_buffers 8 64k;

    # Proxy ke Octane
    location / {
        proxy_pass http://octane:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tambahkan buffer yang sama di sini
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        
        # Pastikan header diteruskan dengan benar
        # proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # proxy_set_header X-Forwarded-Host $host;
        # proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # Static assets langsung dari Nginx
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|webp|map|json)$ {
        root /var/www/html/public;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check
    location /up {
        proxy_pass http://octane:8000;
        access_log off;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
